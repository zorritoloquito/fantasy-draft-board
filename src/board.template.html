<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Ozark Draft Board</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{
  --bg:#0e1116; --panel:#161b22; --panel2:#1c2129; --line:#2a313c;
  --fg:#e6edf3; --dim:#8b949e; --dimmer:#5c6570;
  --qb:#f0883e; --rb:#3fb950; --wr:#58a6ff; --te:#bc8cff;
  --hot:#f85149; --warm:#d29922; --cool:#3fb950;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font:13px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}
.pos-QB{color:var(--qb)} .pos-RB{color:var(--rb)} .pos-WR{color:var(--wr)} .pos-TE{color:var(--te)}
.bg-QB{background:var(--qb)} .bg-RB{background:var(--rb)} .bg-WR{background:var(--wr)} .bg-TE{background:var(--te)}

header{display:flex;gap:12px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--panel)}
#search{flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:6px;color:var(--fg);
  font:16px/1 var(--mono);padding:11px 12px;outline:none}
#search:focus{border-color:var(--wr);box-shadow:0 0 0 3px #58a6ff22}
#search::placeholder{color:var(--dimmer)}
.counter{font:11px/1.3 var(--mono);color:var(--dim);white-space:nowrap;text-align:right}
.counter b{color:var(--fg);font-size:14px}
.counter input{background:var(--panel2);border:1px solid var(--line);color:var(--fg);
  border-radius:4px;font:11px var(--mono);padding:2px 3px;margin:0 1px}
.counter label{color:var(--dimmer)}
button{background:var(--panel2);border:1px solid var(--line);color:var(--dim);border-radius:5px;
  padding:6px 10px;font-size:11px;cursor:pointer;font-family:inherit}
button:hover{color:var(--fg);border-color:var(--dimmer)}

main{display:grid;grid-template-columns:340px 1fr 300px;height:calc(100% - 57px)}
@media(max-width:1200px){main{grid-template-columns:300px 1fr}.col:last-child{display:none}}
.col{overflow-y:auto;padding:10px;border-right:1px solid var(--line)}
.col:last-child{border-right:none}
h2{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);
   margin:0 0 7px;font-weight:600}
h2 span{color:var(--dimmer);letter-spacing:0;text-transform:none;font-weight:400}

/* ---- result / player rows ---- */
.row{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:center;
  padding:5px 7px;border-radius:5px;cursor:pointer;border:1px solid transparent}
.row:hover{background:var(--panel2)}
.row.sel{background:#1f6feb2e;border-color:#1f6feb}
.row .tag{font:600 9px/1.5 var(--mono);text-align:center;border-radius:3px;color:#0e1116;padding:1px 0}
.row .nm{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .sub{font:10px/1.3 var(--mono);color:var(--dimmer)}
.row .rt{font:600 12px/1.2 var(--mono);text-align:right}
.row .rt small{display:block;font-weight:400;font-size:9px;color:var(--dimmer)}
.gone{opacity:.32}
.gone .nm{text-decoration:line-through}
.mine{background:#3fb95018;border-color:#3fb95055}

/* ---- wait-cost cards ---- */
.wc{background:var(--panel);border:1px solid var(--line);border-left-width:3px;
  border-radius:6px;padding:8px 10px;margin-bottom:7px}
.wc .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.wc .pos{font:700 12px/1 var(--mono)}
.wc .cost{font:700 15px/1 var(--mono)}
.wc .who{font-size:12px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wc .bar{height:3px;border-radius:2px;background:var(--line);margin-top:6px;overflow:hidden}
.wc .bar i{display:block;height:100%}
.wc .exp{font:10px/1.3 var(--mono);color:var(--dimmer);margin-top:4px}

.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.pcol h3{font:700 11px/1 var(--mono);margin:0 0 6px;padding-bottom:5px;border-bottom:1px solid var(--line)}
.slot{font:10px/1.5 var(--mono);color:var(--dim);display:flex;justify-content:space-between;
  padding:3px 6px;border-radius:4px;background:var(--panel)}
.slot.empty{color:var(--dimmer);background:transparent;border:1px dashed var(--line)}
.slot+.slot{margin-top:3px}
kbd{font:10px/1 var(--mono);background:var(--panel2);border:1px solid var(--line);
  border-bottom-width:2px;border-radius:3px;padding:2px 4px;color:var(--dim)}
.hint{font-size:10px;color:var(--dimmer);padding:6px 2px;line-height:1.7}
.tierbreak{border-top:1px dashed var(--line);margin:5px 0 3px;padding-top:4px;
  font:9px/1 var(--mono);color:var(--dimmer)}
#toast{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:var(--panel2);
  border:1px solid var(--line);border-radius:6px;padding:8px 14px;font-size:12px;
  opacity:0;transition:opacity .15s;pointer-events:none;z-index:9}
#toast.on{opacity:1}
</style></head><body>

<header>
  <input id="search" placeholder="type a name  →  Enter = drafted by someone else  ·  Shift+Enter = drafted by me" autocomplete="off" spellcheck="false">
  <div class="counter">pick <b id="pickno">1</b> · <span id="remain">237</span> left<br>
    <label>slot <input id="slot" type="number" min="1" max="16" value="1" style="width:38px"></label>
    <label>of <input id="teams" type="number" min="4" max="16" value="10" style="width:38px"></label>
    · next in <b id="gap">–</b></div>
  <button id="undo">↶ Undo <kbd>⌘Z</kbd></button>
  <button id="reset">Reset</button>
</header>

<main>
  <div class="col">
    <h2 id="leftTitle">Best available <span>— by auction $</span></h2>
    <div id="left"></div>
  </div>
  <div class="col">
    <h2>VONA <span>— what waiting until your next pick costs you at each position</span></h2>
    <div id="wait"></div>
    <h2 style="margin-top:14px">Position boards <span>— top 12 available</span></h2>
    <div class="grid4" id="boards"></div>
  </div>
  <div class="col">
    <h2>My roster <span id="rcount"></span></h2>
    <div id="roster"></div>
    <h2 style="margin-top:14px">Recent picks</h2>
    <div id="log"></div>
    <div class="hint">
      <kbd>↑</kbd><kbd>↓</kbd> move · <kbd>Enter</kbd> mark taken<br>
      <kbd>⇧Enter</kbd> mark as my pick · <kbd>⌘Z</kbd> undo<br>
      <kbd>Esc</kbd> clear search
    </div>
  </div>
</main>
<div id="toast"></div>

<script>
const DATA = /*__DATA__*/;
const POSN = ['QB','RB','WR','TE'];
const LS = 'ozark-draft-2026';

/* ---------- state ---------- */
let players = DATA.players.map(p => ({...p}));
let state = { taken:{}, order:[] };   // id -> 'x' | 'o'
let cfg = { teams:10, slot:1 };
try { const c = JSON.parse(localStorage.getItem(LS+':cfg')); if (c) cfg = c; } catch {}
const saveCfg = () => { try { localStorage.setItem(LS+':cfg', JSON.stringify(cfg)); } catch {} };
try { const s = JSON.parse(localStorage.getItem(LS)); if (s && s.taken) state = s; } catch {}
const save = () => { try { localStorage.setItem(LS, JSON.stringify(state)); } catch {} };

// Seed from the sheet's own DRAFT column on first load.
if (!state.order.length) for (const p of players) if (p.draft === 'x' || p.draft === 'o') state.taken[p.id] = p.draft;

const avail  = () => players.filter(p => !state.taken[p.id]);
const mine   = () => players.filter(p => state.taken[p.id] === 'o');
const byVal  = a => [...a].sort((x,y) => (y.value - x.value) || (x.ecr - y.ecr));

/* ---------- the decision model (ported from the sheet's own formulas) ----------
   The xlsx showed VALUE / VOR / PTS / TIER / ECR are all static VLOOKUPs.
   PS is the ONLY dynamic cell:
     SUMIFS(VOR below this row, DRAFT<>"x", DRAFT<>"o", VOR>0) / total positional VOR
   i.e. the share of this position's value still sitting BELOW him, undrafted.
   Verified against the sheet to the rounded percent on all four positions.

   VONA is the thing the sheet can't tell you: what it costs to wait a round.
   Market order = ECR. Between your pick and your next one, N players come off
   the board; assume the market takes the top N by ECR. Whoever is still the
   best at each position after that is your realistic fallback.
------------------------------------------------------------------------------ */
const TOTVOR = {};
for (const p of DATA.players) if (p.vor > 0) TOTVOR[p.pos] = (TOTVOR[p.pos] ?? 0) + p.vor;

function livePS(pool) {                 // pool = undrafted at a position, sorted as the sheet sorts
  const out = new Map();
  let below = pool.reduce((a, p) => a + Math.max(p.vor ?? 0, 0), 0);
  for (const p of pool) { below -= Math.max(p.vor ?? 0, 0); out.set(p.id, below / (TOTVOR[p.pos] || 1) * 100); }
  return out;
}

// My overall pick numbers in a snake draft.
function myPicks() {
  const T = cfg.teams, s = cfg.slot, out = [];
  for (let r = 1; r <= 18; r++) out.push((r - 1) * T + (r % 2 ? s : T - s + 1));
  return out;
}
function gapToNextPick() {
  const done = state.order.length, mine = myPicks();
  const now  = mine.find(p => p > done);          // the pick I'm on / heading to
  const nxt  = mine.find(p => p > (now ?? 0));
  if (!now || !nxt) return 0;
  return nxt - now - 1;                            // others picking in between
}

function decide() {
  const pool = avail();
  const ps   = new Map();
  for (const pos of POSN) for (const [k, v] of livePS(byVal(pool.filter(p => p.pos === pos)))) ps.set(k, v);

  const N = gapToNextPick();
  // market takes the top N by ECR
  const gone = new Set(pool.filter(p => p.ecr != null).sort((a, b) => a.ecr - b.ecr).slice(0, N).map(p => p.id));
  const later = pool.filter(p => !gone.has(p.id));

  const rows = POSN.map(pos => {
    const nowBest   = byVal(pool.filter(p => p.pos === pos))[0];
    const laterBest = byVal(later.filter(p => p.pos === pos))[0];
    if (!nowBest) return null;
    return { pos, now: nowBest, later: laterBest,
             vona: Math.max(nowBest.value - (laterBest ? laterBest.value : 0), 0) };
  }).filter(Boolean).sort((a, b) => b.vona - a.vona);

  return { rows, ps, N };
}

/* ---------- search ---------- */
function score(p, q) {
  const n = p.name.toLowerCase(), t = q.toLowerCase().trim();
  if (!t) return 0;
  if (n.startsWith(t)) return 1000 - p.ecr;
  const last = n.split(' ').slice(1).join(' ');
  if (last.startsWith(t)) return 900 - p.ecr;
  if (n.includes(t)) return 700 - p.ecr;
  // subsequence (initials + fragments, e.g. "jgib" -> Jahmyr Gibbs)
  let i = 0; for (const c of n) if (c === t[i]) i++;
  return i === t.length ? 400 - p.ecr : -1;
}
let sel = 0, results = [];
function recompute() {
  const q = search.value.trim();
  results = q
    ? players.map(p => ({p, s: score(p, q)})).filter(r => r.s >= 0)
        .sort((a,b) => b.s - a.s).slice(0, 40).map(r => r.p)
    : byVal(avail()).slice(0, 40);
  if (sel >= results.length) sel = 0;
}

/* ---------- actions ---------- */
function mark(p, how) {
  if (!p) return;
  state.taken[p.id] = how;
  state.order.push(p.id);
  save(); toast((how === 'o' ? '✓ YOU drafted ' : '✗ ') + p.name); search.value = ''; sel = 0; render();
}
function undo() {
  const id = state.order.pop();
  if (!id) return;
  delete state.taken[id];
  save(); toast('↶ undid ' + id.split(':')[1]); render();
}

/* ---------- render ---------- */
const el = id => document.getElementById(id);
function rowHTML(p, i, selected) {
  const t = state.taken[p.id];
  const cls = ['row', t ? 'gone' : '', t === 'o' ? 'mine' : '', selected ? 'sel' : ''].join(' ');
  return `<div class="${cls}" data-i="${i}">
    <div class="tag bg-${p.pos}">${p.pos}</div>
    <div><div class="nm">${p.name}${t === 'o' ? ' ⭐' : ''}</div>
         <div class="sub">${p.team}·bye ${p.bye ?? '–'} · T${p.tier} · ECR ${p.ecr} · ${(LIVEPS.get(p.id) ?? p.ps).toFixed(0)}% below</div></div>
    <div class="rt">$${p.value}<small>${p.vor} vor</small></div>
  </div>`;
}
let LIVEPS = new Map();
function render() {
  recompute();
  LIVEPS = decide().ps;
  el('left').innerHTML = results.map((p, i) => rowHTML(p, i, i === sel)).join('') || '<div class=hint>no match</div>';
  el('leftTitle').innerHTML = search.value.trim()
    ? 'Search <span>— Enter marks taken, ⇧Enter marks yours</span>'
    : 'Best available <span>— by auction $</span>';
  el('remain').textContent = avail().length;
  el('pickno').textContent = state.order.length + 1;

  const { rows: vrows, N } = decide();
  el('gap').textContent = N + ' picks';
  const max = Math.max(...vrows.map(c => c.vona), 1);
  el('wait').innerHTML = vrows.map(c => {
    const hue = c.vona > max * .6 ? 'hot' : c.vona > max * .25 ? 'warm' : 'cool';
    const psNow = (LIVEPS.get(c.now.id) ?? 0).toFixed(0);
    return `<div class="wc" style="border-left-color:var(--${c.pos.toLowerCase()})">
      <div class="top"><span class="pos pos-${c.pos}">${c.pos}</span>
        <span class="cost" style="color:var(--${hue})">−$${c.vona.toFixed(0)}</span></div>
      <div class="who">${c.now.name} <span style="color:var(--dimmer)">$${c.now.value} · ${psNow}% of ${c.pos} value left below him</span></div>
      <div class="bar"><i class="bg-${c.pos}" style="width:${(c.vona / max * 100).toFixed(0)}%"></i></div>
      <div class="exp">wait ${N} picks → ${c.later ? c.later.name + ' ($' + c.later.value + ')' : 'nothing left'}</div>
    </div>`;
  }).join('');

  el('boards').innerHTML = POSN.map(pos => {
    const pool = byVal(avail().filter(p => p.pos === pos)).slice(0, 12);
    let last = null;
    return `<div class="pcol"><h3 class="pos-${pos}">${pos}</h3>` + pool.map(p => {
      const br = last !== null && p.tier !== last ? `<div class="tierbreak">tier ${p.tier}</div>` : '';
      last = p.tier;
      return br + `<div class="slot"><span>${p.name.split(' ').map((w,i)=>i?w:w[0]+'.').join(' ')}</span><span>$${p.value}</span></div>`;
    }).join('') + '</div>';
  }).join('');

  const r = byVal(mine());
  el('rcount').textContent = `— ${r.length}`;
  el('roster').innerHTML = r.length
    ? r.map(p => `<div class="slot"><span class="pos-${p.pos}">${p.pos} ${p.name}</span><span>bye ${p.bye ?? '–'}</span></div>`).join('')
    : '<div class="slot empty">nothing yet — ⇧Enter to add</div>';

  el('log').innerHTML = state.order.slice(-8).reverse().map(id => {
    const p = players.find(x => x.id === id); if (!p) return '';
    return `<div class="slot"><span class="${state.taken[id]==='o'?'pos-RB':''}">${state.taken[id]==='o'?'⭐ ':''}${p.name}</span><span class="pos-${p.pos}">${p.pos}</span></div>`;
  }).join('') || '<div class="slot empty">no picks yet</div>';
}

/* ---------- events ---------- */
const search = el('search');
let tt; const toast = m => { const t = el('toast'); t.textContent = m; t.classList.add('on');
  clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 1400); };

search.addEventListener('input', render);
document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key === 'z') { e.preventDefault(); return undo(); }
  if (e.key === 'ArrowDown') { e.preventDefault(); sel = Math.min(sel + 1, results.length - 1); return render(); }
  if (e.key === 'ArrowUp')   { e.preventDefault(); sel = Math.max(sel - 1, 0); return render(); }
  if (e.key === 'Enter')     { e.preventDefault(); return mark(results[sel], e.shiftKey ? 'o' : 'x'); }
  if (e.key === 'Escape')    { search.value = ''; sel = 0; return render(); }
  if (document.activeElement !== search) search.focus();
});
el('left').addEventListener('click', e => {
  const r = e.target.closest('.row'); if (!r) return;
  mark(results[+r.dataset.i], e.shiftKey ? 'o' : 'x');
});
el('slot').value = cfg.slot; el('teams').value = cfg.teams;
el('slot').onchange  = e => { cfg.slot  = +e.target.value || 1;  saveCfg(); render(); };
el('teams').onchange = e => { cfg.teams = +e.target.value || 10; saveCfg(); render(); };
for (const id of ['slot','teams']) el(id).onkeydown = e => e.stopPropagation();
el('undo').onclick = undo;
el('reset').onclick = () => { if (confirm('Clear the whole draft?')) { state = {taken:{},order:[]}; save(); render(); } };
search.focus();
render();
</script></body></html>
